name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo check --workspace --all-targets --no-default-features
      - run: bash scripts/test-install.sh
      - run: python3 -m unittest discover -s tests/demo -p test_drivers.py

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings

  linux-binary:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, advisories]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p helm-cli
      - run: cp target/release/helm helm-x86_64-unknown-linux-gnu
      - run: sha256sum helm-x86_64-unknown-linux-gnu > helm-x86_64-unknown-linux-gnu.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            install.sh
            helm-x86_64-unknown-linux-gnu
            helm-x86_64-unknown-linux-gnu.sha256
